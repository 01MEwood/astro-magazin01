[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hop-werkzeug"
version = "0.1.0"
description = "Liest und schreibt .hop-Dateien und erzeugt CNC-Programme aus Korpuswerk-Bauteilen"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hop = "hop.__main__:main"

[tool.setuptools]
packages = ["hop", "post", "nest", "serie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
